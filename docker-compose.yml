services:
    mysql:
        image: mysql:8.0
        container_name: c2c-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: c2c_marketplace
            MYSQL_USER: c2c_user
            MYSQL_PASSWORD: c2c_password
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
            interval: 10s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: c2c-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

    minio:
        image: quay.io/minio/minio:latest
        container_name: c2c-minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio_data:/data

    backend:
        build: ./backend
        container_name: c2c-backend
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        env_file:
            - ./backend/.env
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
            STORAGE_ENDPOINT: http://minio:9000
        ports:
            - "4000:4000"
        volumes:
            - ./backend:/app
            - /app/node_modules

    frontend:
        build: ./frontend
        container_name: c2c-frontend
        restart: unless-stopped
        depends_on:
            - backend
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - /app/node_modules

volumes:
    mysql_data:
    redis_data:
    minio_data:
